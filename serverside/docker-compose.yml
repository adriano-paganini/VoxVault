services:
  voxvault:
    build: .
    image: voxvault-server:latest
    env_file:
      - .env
    ports:
      - "${VOXVAULT_PORT:-6100}:6100"
    environment:
      VOXVAULT_PORT: 6100
      VOXVAULT_PRIVATE_KEY_PATH: /data/server-privatekey.key
      VOXVAULT_PRIVATE_KEY_HOST_PATH: /etc/voxvault/server-privatekey.key
    volumes:
      # Mount the host key directory. The app creates server-privatekey.key inside it.
      - ${VOXVAULT_KEY_DIR_HOST:-/etc/voxvault}:/data
