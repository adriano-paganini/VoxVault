services:
  voxvault:
    build: .
    image: voxvault-server:latest
    ports:
      - "${VOXVAULT_PORT:?Set VOXVAULT_PORT in .env}:${VOXVAULT_PORT}"
    volumes:
      - ./.env:/app/.env:ro
      - ${VOXVAULT_KEY_DIR_HOST:?Set VOXVAULT_KEY_DIR_HOST in .env}:${VOXVAULT_KEY_DIR_HOST}
      - voxvault-models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from config import settings; import urllib.request; urllib.request.urlopen(f'http://localhost:{settings.VOXVAULT_PORT}/api/setup/status', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  reset-keys:
    profiles: ["reset"]
    image: voxvault-server:latest
    pull_policy: never
    user: "0:0"
    network_mode: none
    entrypoint: ["rm", "-f", "--", "${VOXVAULT_KEY_DIR_HOST:?Set VOXVAULT_KEY_DIR_HOST in .env}/server-privatekey.key"]
    volumes:
      - ${VOXVAULT_KEY_DIR_HOST}:${VOXVAULT_KEY_DIR_HOST}

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - voxvault-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  voxvault-postgres:
  voxvault-models:
